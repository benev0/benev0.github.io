name: test

on:
  push:
    branches:
      - main
    paths:
      - '*.toml'
      - 'src/**'
      - 'test/**'
      - '.github/workflows.test.yml'
  pull_request:
    branches:
      - main
    paths:
      - '*.toml'
      - 'src/**'
      - 'test/**'
      - '.github/workflows.test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.1.2"
          gleam-version: "1.10.0"
          rebar3-version: "3"
          # elixir-version: "1"
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
